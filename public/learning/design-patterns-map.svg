<svg width="1280" height="950" viewBox="0 0 1280 950" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">디자인 패턴 23종 분류 지도</title>
  <desc id="desc">디자인 패턴 전체 23종을 생성, 구조, 행위 패턴으로 분류하고 각 분류를 선택하는 질문을 보여주는 학습 도식</desc>
  <rect width="1280" height="950" rx="30" fill="#F7FAFF"/>

  <rect x="40" y="36" width="1200" height="132" rx="24" fill="#18304D"/>
  <text x="76" y="79" fill="#AFCBEF" font-family="Arial, Malgun Gothic, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">DESIGN PATTERN · 23 PATTERNS</text>
  <text x="76" y="117" fill="white" font-family="Arial, Malgun Gothic, sans-serif" font-size="30" font-weight="700">디자인 패턴은 ‘문제의 종류’로 먼저 나누면 훨씬 쉽게 이해됩니다.</text>
  <text x="76" y="144" fill="#D7E5F6" font-family="Arial, Malgun Gothic, sans-serif" font-size="16">아래 세 질문 중 하나를 고른 뒤, 해당 열의 패턴을 살펴보세요.</text>

  <rect x="40" y="188" width="384" height="58" rx="15" fill="#EEF6FF" stroke="#B8D4F7"/>
  <text x="232" y="224" text-anchor="middle" fill="#2767B9" font-family="Arial, Malgun Gothic, sans-serif" font-size="16" font-weight="700">객체를 어떻게 만들까? → 생성 패턴</text>
  <rect x="448" y="188" width="384" height="58" rx="15" fill="#F4F1FF" stroke="#D1C8F4"/>
  <text x="640" y="224" text-anchor="middle" fill="#634DB5" font-family="Arial, Malgun Gothic, sans-serif" font-size="16" font-weight="700">객체를 어떻게 연결할까? → 구조 패턴</text>
  <rect x="856" y="188" width="384" height="58" rx="15" fill="#FFF4EB" stroke="#F6CFAB"/>
  <text x="1048" y="224" text-anchor="middle" fill="#B86E2B" font-family="Arial, Malgun Gothic, sans-serif" font-size="16" font-weight="700">객체가 어떻게 협력할까? → 행위 패턴</text>

  <rect x="40" y="274" width="384" height="614" rx="22" fill="white" stroke="#9BC0F2" stroke-width="2"/>
  <rect x="40" y="274" width="384" height="112" rx="22" fill="#2C7BE5"/>
  <rect x="40" y="354" width="384" height="32" fill="#2C7BE5"/>
  <circle cx="80" cy="316" r="20" fill="white" fill-opacity=".2"/>
  <text x="80" y="322" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="15" font-weight="700">01</text>
  <text x="114" y="318" fill="white" font-family="Arial, Malgun Gothic, sans-serif" font-size="24" font-weight="700">생성 패턴</text>
  <text x="114" y="347" fill="#EAF3FF" font-family="Arial, Malgun Gothic, sans-serif" font-size="14" font-weight="700">CREATIONAL · 5개</text>
  <text x="68" y="420" fill="#2767B9" font-family="Arial, Malgun Gothic, sans-serif" font-size="14" font-weight="700">언제 선택할까?</text>
  <text x="68" y="445" fill="#4D6B89" font-family="Arial, Malgun Gothic, sans-serif" font-size="15">생성 방법·조립 순서·객체 수를 바꿀 때</text>
  <line x1="68" y1="474" x2="396" y2="474" stroke="#DCE7F5" stroke-width="2"/>
  <text x="68" y="506" fill="#52647C" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" font-weight="700">전체 패턴</text>
  <rect x="68" y="522" width="328" height="42" rx="10" fill="#F5F9FF"/><text x="84" y="549" fill="#334D6A" font-family="Arial, Malgun Gothic, sans-serif" font-size="14">Factory Method (팩토리 메서드)</text>
  <rect x="68" y="572" width="328" height="42" rx="10" fill="#F5F9FF"/><text x="84" y="599" fill="#334D6A" font-family="Arial, Malgun Gothic, sans-serif" font-size="14">Abstract Factory (추상 팩토리)</text>
  <rect x="68" y="622" width="328" height="42" rx="10" fill="#F5F9FF"/><text x="84" y="649" fill="#334D6A" font-family="Arial, Malgun Gothic, sans-serif" font-size="14">Builder (빌더)</text>
  <rect x="68" y="672" width="328" height="42" rx="10" fill="#F5F9FF"/><text x="84" y="699" fill="#334D6A" font-family="Arial, Malgun Gothic, sans-serif" font-size="14">Prototype (프로토타입)</text>
  <rect x="68" y="722" width="328" height="42" rx="10" fill="#F5F9FF"/><text x="84" y="749" fill="#334D6A" font-family="Arial, Malgun Gothic, sans-serif" font-size="14">Singleton (싱글톤)</text>

  <rect x="448" y="274" width="384" height="614" rx="22" fill="white" stroke="#B7A9EE" stroke-width="2"/>
  <rect x="448" y="274" width="384" height="112" rx="22" fill="#765DD6"/>
  <rect x="448" y="354" width="384" height="32" fill="#765DD6"/>
  <circle cx="488" cy="316" r="20" fill="white" fill-opacity=".2"/>
  <text x="488" y="322" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="15" font-weight="700">02</text>
  <text x="522" y="318" fill="white" font-family="Arial, Malgun Gothic, sans-serif" font-size="24" font-weight="700">구조 패턴</text>
  <text x="522" y="347" fill="#F2EEFF" font-family="Arial, Malgun Gothic, sans-serif" font-size="14" font-weight="700">STRUCTURAL · 7개</text>
  <text x="476" y="420" fill="#634DB5" font-family="Arial, Malgun Gothic, sans-serif" font-size="14" font-weight="700">언제 선택할까?</text>
  <text x="476" y="445" fill="#675E8C" font-family="Arial, Malgun Gothic, sans-serif" font-size="15">인터페이스·구조·접근 방식을 바꿀 때</text>
  <line x1="476" y1="474" x2="804" y2="474" stroke="#E4DDF9" stroke-width="2"/>
  <text x="476" y="506" fill="#52647C" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" font-weight="700">전체 패턴</text>
  <rect x="476" y="522" width="328" height="36" rx="9" fill="#F8F6FF"/><text x="492" y="546" fill="#4C4767" font-family="Arial, Malgun Gothic, sans-serif" font-size="13">Adapter (어댑터)</text>
  <rect x="476" y="564" width="328" height="36" rx="9" fill="#F8F6FF"/><text x="492" y="588" fill="#4C4767" font-family="Arial, Malgun Gothic, sans-serif" font-size="13">Bridge (브리지)</text>
  <rect x="476" y="606" width="328" height="36" rx="9" fill="#F8F6FF"/><text x="492" y="630" fill="#4C4767" font-family="Arial, Malgun Gothic, sans-serif" font-size="13">Composite (컴포지트)</text>
  <rect x="476" y="648" width="328" height="36" rx="9" fill="#F8F6FF"/><text x="492" y="672" fill="#4C4767" font-family="Arial, Malgun Gothic, sans-serif" font-size="13">Decorator (데코레이터)</text>
  <rect x="476" y="690" width="328" height="36" rx="9" fill="#F8F6FF"/><text x="492" y="714" fill="#4C4767" font-family="Arial, Malgun Gothic, sans-serif" font-size="13">Facade (퍼사드)</text>
  <rect x="476" y="732" width="328" height="36" rx="9" fill="#F8F6FF"/><text x="492" y="756" fill="#4C4767" font-family="Arial, Malgun Gothic, sans-serif" font-size="13">Flyweight (플라이웨이트)</text>
  <rect x="476" y="774" width="328" height="36" rx="9" fill="#F8F6FF"/><text x="492" y="798" fill="#4C4767" font-family="Arial, Malgun Gothic, sans-serif" font-size="13">Proxy (프록시)</text>

  <rect x="856" y="274" width="384" height="614" rx="22" fill="white" stroke="#F2B477" stroke-width="2"/>
  <rect x="856" y="274" width="384" height="112" rx="22" fill="#E8893F"/>
  <rect x="856" y="354" width="384" height="32" fill="#E8893F"/>
  <circle cx="896" cy="316" r="20" fill="white" fill-opacity=".2"/>
  <text x="896" y="322" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="15" font-weight="700">03</text>
  <text x="930" y="318" fill="white" font-family="Arial, Malgun Gothic, sans-serif" font-size="24" font-weight="700">행위 패턴</text>
  <text x="930" y="347" fill="#FFF2E8" font-family="Arial, Malgun Gothic, sans-serif" font-size="14" font-weight="700">BEHAVIORAL · 11개</text>
  <text x="884" y="420" fill="#B86E2B" font-family="Arial, Malgun Gothic, sans-serif" font-size="14" font-weight="700">언제 선택할까?</text>
  <text x="884" y="445" fill="#87684D" font-family="Arial, Malgun Gothic, sans-serif" font-size="15">요청·상태·알고리즘의 흐름을 바꿀 때</text>
  <line x1="884" y1="474" x2="1212" y2="474" stroke="#F8E1CC" stroke-width="2"/>
  <text x="884" y="506" fill="#52647C" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" font-weight="700">전체 패턴</text>
  <rect x="884" y="522" width="328" height="27" rx="8" fill="#FFF9F4"/><text x="898" y="541" fill="#604D3B" font-family="Arial, Malgun Gothic, sans-serif" font-size="12.5">Chain of Responsibility (책임 연쇄)</text>
  <rect x="884" y="554" width="328" height="27" rx="8" fill="#FFF9F4"/><text x="898" y="573" fill="#604D3B" font-family="Arial, Malgun Gothic, sans-serif" font-size="12.5">Command (커맨드)</text>
  <rect x="884" y="586" width="328" height="27" rx="8" fill="#FFF9F4"/><text x="898" y="605" fill="#604D3B" font-family="Arial, Malgun Gothic, sans-serif" font-size="12.5">Interpreter (인터프리터)</text>
  <rect x="884" y="618" width="328" height="27" rx="8" fill="#FFF9F4"/><text x="898" y="637" fill="#604D3B" font-family="Arial, Malgun Gothic, sans-serif" font-size="12.5">Iterator (이터레이터)</text>
  <rect x="884" y="650" width="328" height="27" rx="8" fill="#FFF9F4"/><text x="898" y="669" fill="#604D3B" font-family="Arial, Malgun Gothic, sans-serif" font-size="12.5">Mediator (중재자)</text>
  <rect x="884" y="682" width="328" height="27" rx="8" fill="#FFF9F4"/><text x="898" y="701" fill="#604D3B" font-family="Arial, Malgun Gothic, sans-serif" font-size="12.5">Memento (메멘토)</text>
  <rect x="884" y="714" width="328" height="27" rx="8" fill="#FFF9F4"/><text x="898" y="733" fill="#604D3B" font-family="Arial, Malgun Gothic, sans-serif" font-size="12.5">Observer (옵저버)</text>
  <rect x="884" y="746" width="328" height="27" rx="8" fill="#FFF9F4"/><text x="898" y="765" fill="#604D3B" font-family="Arial, Malgun Gothic, sans-serif" font-size="12.5">State (상태)</text>
  <rect x="884" y="778" width="328" height="27" rx="8" fill="#FFF9F4"/><text x="898" y="797" fill="#604D3B" font-family="Arial, Malgun Gothic, sans-serif" font-size="12.5">Strategy (전략)</text>
  <rect x="884" y="810" width="328" height="27" rx="8" fill="#FFF9F4"/><text x="898" y="829" fill="#604D3B" font-family="Arial, Malgun Gothic, sans-serif" font-size="12.5">Template Method (템플릿 메서드)</text>
  <rect x="884" y="842" width="328" height="27" rx="8" fill="#FFF9F4"/><text x="898" y="861" fill="#604D3B" font-family="Arial, Malgun Gothic, sans-serif" font-size="12.5">Visitor (방문자)</text>

  <rect x="40" y="908" width="1200" height="26" rx="9" fill="#EAF1FA"/>
  <text x="640" y="927" text-anchor="middle" fill="#52647C" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" font-weight="700">분류 지도에서 패턴을 찾고, 아래 상세 카드에서 의미·원리·예시를 이어서 학습하세요.</text>
</svg>
